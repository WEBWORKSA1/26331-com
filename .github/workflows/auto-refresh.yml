name: Auto-refresh daily data

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh number of the day, FX rates and sitemap
        run: python3 scripts/refresh.py
      - name: Commit changes
        run: |
          git config user.name "26331-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json sitemap.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: daily data refresh $(date -u +%F)"
          git push
